server {
    listen 80;
    server_name _;

    # Serve static Vite/React files from /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API reverse proxy ───────────────────────────────────────────────────
    # Requests to /api/... are forwarded to the backend container.
    # Docker Compose service name "backend" resolves via Docker's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — Elexon calls can be slow when chunking large ranges.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── Swagger / OpenAPI docs ──────────────────────────────────────────────
    location /docs {
        proxy_pass         http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location /openapi.json {
        proxy_pass         http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── React SPA — always return index.html for client-side routes ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite fingerprints filenames on build).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
